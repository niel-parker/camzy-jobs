services:
  mysql:
    image: mysql:8.0
    container_name: camzy_jobs_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: job_portal_db
      MYSQL_USER: job_user
      MYSQL_PASSWORD: job_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: camzy_jobs_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: camzy_jobs_backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: job_user
      DB_PASS: job_password
      DB_NAME: job_portal_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STRIPE_SECRET_KEY: sk_test_51UOPRtIeu7vvxPLc3VaRMJDdlMzK00tDlUoFZUlqWpIccZ1xHoCz4hxkL7qFoMJl3LrXiH2aMK1Zf2qxf4wszWfS00pxU3Dt0W
    depends_on:
      - mysql
      - redis

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: camzy_jobs_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    depends_on:
      - backend

volumes:
  mysql_data:
